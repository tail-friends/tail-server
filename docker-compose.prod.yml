# 운영 서버용. 이미지는 CI가 GHCR에 올린 것을 쓴다 (배포 워크플로가 IMAGE_TAG를 넘긴다).
# 서버의 /opt/tail-server/.env 에 운영 환경 변수를 둔다 (.env.example 참고, SPRING_PROFILES_ACTIVE=prod).
services:
  postgres:
    image: postgres:16
    container_name: tailfriends-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailfriends}
      POSTGRES_USER: ${POSTGRES_USER:-tailfriends}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    # DB 포트는 밖으로 열지 않는다
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/tail-friends/tail-server:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: tailfriends-server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tailfriends}
      STORAGE_LOCAL_PATH: /app/storage
    # 밖에서는 caddy(443)로만 들어온다. 8080은 서버 안(배포 헬스 체크)에서만 연다
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - photo-data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  # HTTPS 리버스 프록시. API_DOMAIN → app, ADMIN_DOMAIN → 관리자 웹(ADMIN_UPSTREAM)
  # 관리자 웹은 지금 서버의 3001 포트에 떠 있어 host.docker.internal:3001로 넘긴다 (docs/deploy.md 1-6)
  caddy:
    image: caddy:2.10.0
    container_name: tailfriends-caddy
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      ADMIN_UPSTREAM: ${ADMIN_UPSTREAM:-host.docker.internal:3001}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # 모니터링. 서버의 관리 포트(8081)는 게시하지 않고 같은 네트워크에서 app:8081을 수집한다.
  # 프로메테우스는 밖으로 열지 않는다.
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: tailfriends-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      # 배포 때 설정 파일이 바뀌면 SIGHUP으로 다시 읽는다 (deploy-remote.sh)
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # 그라파나는 서버의 127.0.0.1에만 연다. SSH 터널로 접속한다 (docs/deploy.md).
  grafana:
    image: grafana/grafana:13.0.2
    container_name: tailfriends-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  photo-data:
  prometheus-data:
  grafana-data:
  # 발급받은 인증서. 지우면 다시 발급받는다 (Let's Encrypt 발급 횟수 제한 주의)
  caddy-data:
  caddy-config:
