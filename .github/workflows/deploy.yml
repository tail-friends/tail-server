name: Deploy

# main의 CI(빌드·테스트·이미지 게시)가 성공하면 그 커밋의 이미지를 운영 서버에 배포한다
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그 (예: sha-1a2b3c4). 비우면 main 최신 커밋"
        required: false

# 동시에 두 번 배포되지 않도록 순서대로 처리한다
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to prod
    # CI가 실패한 실행은 배포하지 않는다
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod

    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ -n "$RUN_SHA" ]; then
            tag="sha-${RUN_SHA::7}"
          else
            tag="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "배포할 이미지: $tag"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # 미리 등록해 둔 서버 호스트 키로만 접속한다. 키가 다르면 ssh/scp가 실패한다.
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS 시크릿이 없어 접속 시점의 호스트 키를 신뢰합니다. 시크릿을 등록해 고정하세요."
            ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Upload compose and monitoring files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" \
            docker-compose.prod.yml "$SSH_USER@$SSH_HOST:/opt/tail-server/docker-compose.yml"
          # 모니터링 설정(프로메테우스·그라파나). 지운 파일이 남지 않도록 폴더를 통째로 바꾼다
          tar -czf - monitoring | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "rm -rf /opt/tail-server/monitoring && tar -xzf - -C /opt/tail-server"

      - name: Pull, restart and health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" \
            .github/scripts/deploy-remote.sh "$SSH_USER@$SSH_HOST:/opt/tail-server/deploy.sh"
          # 서버 출력을 남겨 두고 알림에서 롤백 여부를 판단한다. tee를 거쳐도 ssh의 실패가 단계 실패가 되게 한다
          set -o pipefail
          # 토큰은 명령줄이 아니라 표준 입력으로 넘긴다
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' GHCR_USER='$GHCR_USER' bash /opt/tail-server/deploy.sh" 2>&1 \
            | tee "$RUNNER_TEMP/deploy.log"

      # 성공·실패 모두 알린다. 취소된 실행은 알리지 않는다. 알림이 실패해도 배포 결과는 바꾸지 않는다
      - name: Notify Discord
        if: success() || failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ vars.DISCORD_USER_MAP }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_TAG: ${{ steps.tag.outputs.tag }}
          DEPLOY_ACTOR: ${{ github.triggering_actor }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          log="$RUNNER_TEMP/deploy.log"
          if [ "$JOB_STATUS" = success ]; then
            result=success
          elif grep -q '^ROLLBACK OK' "$log" 2>/dev/null; then
            result=rolled-back
          elif grep -q '^ROLLBACK FAIL' "$log" 2>/dev/null; then
            result=rollback-failed
          else
            result=failed
          fi
          DEPLOY_RESULT=$result .github/scripts/discord-notify.sh deploy
