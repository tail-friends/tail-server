name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Check integration tests ran
        run: |
          ls build/test-results/test/TEST-*IntegrationTest.xml > /dev/null
          if grep -l 'skipped="[1-9]' build/test-results/test/TEST-*IntegrationTest.xml; then
            echo "통합 테스트가 건너뛰어졌습니다. Docker를 사용할 수 있는지 확인하세요."
            exit 1
          fi

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ vars.DISCORD_USER_MAP }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_ACTOR: ${{ github.actor }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/discord-notify.sh ci-failed
