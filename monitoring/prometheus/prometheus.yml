# 운영용 (docker-compose.prod.yml). 같은 도커 네트워크의 app 컨테이너 관리 포트를 수집한다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tail-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
