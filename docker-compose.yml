services:
  postgres:
    image: postgres:16
    container_name: tailfriends-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailfriends}
      POSTGRES_USER: ${POSTGRES_USER:-tailfriends}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 서버까지 함께 띄울 때만: docker compose --profile app up -d --build
  # 백엔드 개발 중에는 DB만 띄우고(docker compose up -d) 서버는 ./gradlew bootRun으로 실행한다.
  app:
    profiles: ["app"]
    build: .
    container_name: tailfriends-server
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tailfriends}
      DEV_LOGIN_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
