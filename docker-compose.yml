services:
  postgres:
    image: postgres:16
    container_name: tailfriends-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailfriends}
      POSTGRES_USER: ${POSTGRES_USER:-tailfriends}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
