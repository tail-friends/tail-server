spring:
  jpa:
    show-sql: false

# 앞단 프록시(caddy)가 보낸 X-Forwarded-Proto·For를 믿는다. 요청 주소가 https로 잡힌다.
# 8080은 서버 안에만 열려 있어 이 헤더는 같은 도커 네트워크의 caddy만 보낼 수 있다.
server:
  forward-headers-strategy: native

# 운영에서는 테스트 로그인을 끈다. 환경 변수 DEV_LOGIN_ENABLED=true가 이 값을 덮으면 DevLoginProdGuard가 서버 시작을 막는다
dev:
  login:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.tailfriends: info
