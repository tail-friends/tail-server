# 테스트 전용 (통합 테스트, @WebMvcTestSupport). DB 접속 정보는 Testcontainers(@ServiceConnection)가 덮어쓴다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test

jwt:
  secret: test-jwt-secret-that-is-at-least-32-bytes-long

cors:
  allowed-origins: http://localhost:3000

# 테스트에서 올린 사진은 build 폴더에 둔다. (./gradlew clean으로 지워짐)
storage:
  local-path: build/test-storage
  public-url: http://localhost/files

# 테스트 전용 토큰 암호화 키 (32바이트)
oauth:
  token-encryption-key: dGVzdC1vYXV0aC10b2tlbi1lbmNyeXB0aW9uLWtleSE=
